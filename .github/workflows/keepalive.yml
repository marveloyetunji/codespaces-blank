name: Keep Supabase awake
on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl -fsS "https://kgdnzbthqpmzxnxuvvvg.supabase.co/rest/v1/reports?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
